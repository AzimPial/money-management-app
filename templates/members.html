<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ group_name }} Members - SyncCent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F5F0E8; --card: #FFFDF8; --text-main: #2C2416; --text-sub: #7A7067; --border: #E8DFD3; --primary: #2C2416; --r: #D9534F; }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #F0EBE3 0%, #F5F0E8 50%, #EBE5DC 100%);
            pointer-events: none;
            z-index: -1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; }
        .top-bar { background: var(--card); color: var(--text-main); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .back-btn { color: var(--text-main); text-decoration: none; font-size: 1.25rem; }
        h1 { font-size: 1.1rem; font-weight: 600; flex: 1; letter-spacing: -0.025em; }
        .container { max-width: 550px; margin: 0 auto; padding: 1.5rem 1rem; }
        .card { background: var(--card); border-radius: 24px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); }
        .st { font-size: 0.875rem; font-weight: 600; color: var(--text-sub); margin-bottom: 1rem; }
        .invite-box { display: flex; align-items: center; gap: 0.75rem; background: var(--bg); padding: 1rem; border-radius: 14px; margin-bottom: 1.5rem; }
        .invite-code { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.1em; }
        .copy-btn { background: var(--primary); color: #fff; padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; }
        .ml { list-style: none; }
        .mi { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: var(--bg); border-radius: 14px; margin-bottom: 0.75rem; }
        .mi-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.1rem; }
        .mi-name { font-weight: 600; }
        .mi-label { font-size: 0.8rem; color: var(--text-sub); }
        .leave-btn { width: 100%; padding: 1rem; background: var(--r); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="back-btn">←</a>
        <h1>Members</h1>
    </div>
    <div class="container">
        <div class="card">
            <div class="st">Group Code</div>
            <div class="invite-box">
                <span class="invite-code">{{ invite_code }}</span>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('{{ invite_code }}')">Copy</button>
            </div>
        </div>
        <div class="card">
            <div class="st">Members ({{ members|length }})</div>
            <ul class="ml">
                {% for m in members %}
                <li class="mi">
                    <div class="mi-avatar">{{ m[0]|upper }}</div>
                    <div>
                        <div class="mi-name">{{ m }}</div>
                        {% if m == username %}<div class="mi-label">You</div>{% endif %}
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
        <form method="POST" action="/leave_group">
            <button type="submit" class="leave-btn" onclick="return confirm('Leave this group?')">Leave Group</button>
        </form>
    </div>
</body>
</html>
