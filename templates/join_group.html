<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Group - SyncCent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F5F0E8; --card: #FFFDF8; --text-main: #2C2416; --text-sub: #7A7067; --border: #E8DFD3; --primary: #2C2416; }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #F0EBE3 0%, #F5F0E8 50%, #EBE5DC 100%);
            pointer-events: none;
            z-index: -1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        .top-bar { background: var(--card); color: var(--text-main); padding: 1rem; display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .top-bar a { color: var(--text-main); text-decoration: none; font-size: 1.25rem; }
        .top-bar h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
        .c { max-width: 400px; margin: 0 auto; padding: 1.5rem 1rem; }
        .card { background: var(--card); border-radius: 24px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); }
        .st { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 14px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 1rem; background: var(--bg); }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 1rem; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-bar"><a href="/groups">←</a><h1>Join Group</h1></div>
    <div class="c">
        <div class="card">
            <div class="st">Enter Invite Code</div>
            <form method="POST" action="/join_group">
                <input type="text" name="invite_code" placeholder="ABC123" required maxlength="10" autofocus>
                <button type="submit">Join Group</button>
            </form>
        </div>
    </div>
</body>
</html>
