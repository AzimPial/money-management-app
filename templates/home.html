<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2C2416">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SyncCent</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F5F0E8; --card: #FFFDF8; --text-main: #2C2416; --text-sub: #7A7067; --border: #E8DFD3; --primary: #2C2416; }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #F0EBE3 0%, #F5F0E8 50%, #EBE5DC 100%);
            pointer-events: none;
            z-index: -1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; -webkit-font-smoothing: antialiased; }
        .c { max-width: 450px; width: 100%; }
        h1 { font-size: 2rem; margin: 0 0 0.5rem; letter-spacing: -0.05em; }
        .s { color: var(--text-sub); font-size: 1rem; margin-bottom: 1.5rem; }
        .g { text-align: center; margin-bottom: 1.5rem; font-size: 1rem; color: var(--text-sub); }
        .g strong { color: var(--text-main); font-weight: 600; }
        .o { display: grid; gap: 1rem; }
        .oc { background: var(--card); padding: 1.5rem; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); cursor: pointer; transition: all 0.2s; text-decoration: none; display: block; border: 1px solid rgba(0,0,0,0.02); }
        .oc:hover { border-color: var(--text-main); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .oi { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .ot { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); }
        .od { color: var(--text-sub); font-size: 0.875rem; }
        .l { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-sub); text-decoration: none; font-size: 0.875rem; }
        @media (max-width: 480px) { .c { padding: 0.5rem; } .oc { padding: 1.25rem; } .oi { font-size: 2rem; } }
        * { -webkit-tap-highlight-color: rgba(0,0,0,0); }
    </style>
</head>
<body>
    <div class="c">
        <header style="text-align:center;margin-bottom:1.5rem"><h1>SyncCent</h1><p class="s">Track your expenses your way</p></header>
        <div class="g">Welcome, <strong>{{ username }}</strong>!</div>
        <div class="o">
            <a href="/personal" class="oc"><div class="oi">👤</div><div class="ot">My Expenses</div><div class="od">Track your personal expenses privately.</div></a>
            <a href="/groups" class="oc"><div class="oi">👥</div><div class="ot">Group Expenses</div><div class="od">Share and track expenses with others.</div></a>
        </div>
        <a href="/logout" class="l">Logout</a>
    </div>
</body>
</html>
