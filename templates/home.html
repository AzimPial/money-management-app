<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncCent</title>
    <style>
        :root{--p:#6366f1;--bg:#f1f5f9;--c:#fff;--t:#1e293b;--tl:#64748b}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;-webkit-font-smoothing:antialiased}
        .c{max-width:450px;width:100%}
        h1{color:var(--p);font-size:2rem;margin:0 0 .5rem}
        .s{color:var(--tl);font-size:1rem;margin-bottom:1.5rem}
        .g{text-align:center;margin-bottom:1.5rem;font-size:1.1rem}
        .g strong{color:var(--p)}
        .o{display:grid;gap:1rem}
        .oc{background:var(--c);padding:1.5rem;border-radius:1rem;box-shadow:0 4px 6px rgba(0,0,0,.1);cursor:pointer;transition:all .2s;text-decoration:none;display:block;border:2px solid transparent}
        .oc:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:0 8px 12px rgba(0,0,0,.15)}
        .oi{font-size:2.5rem;margin-bottom:.75rem}
        .ot{font-size:1.25rem;font-weight:600;margin-bottom:.5rem;color:var(--t)}
        .od{color:var(--tl);font-size:.875rem}
        .l{display:block;text-align:center;margin-top:1.5rem;color:var(--tl);text-decoration:none}
        .l:hover{color:var(--p)}
    </style>
</head>
<body>
    <div class="c">
        <header style="text-align:center;margin-bottom:1.5rem"><h1>SyncCent</h1><p class="s">Track your expenses your way</p></header>
        <div class="g">Welcome, <strong>{{ username }}</strong>!</div>
        <div class="o">
            <a href="/personal" class="oc"><div class="oi">👤</div><div class="ot">My Expenses</div><div class="od">Track your personal expenses privately.</div></a>
            <a href="/groups" class="oc"><div class="oi">👥</div><div class="ot">Group Expenses</div><div class="od">Share and track expenses with others.</div></a>
        </div>
        <a href="/logout" class="l">Logout</a>
    </div>
</body>
</html>
