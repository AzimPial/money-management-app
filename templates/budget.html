<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2C2416">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Budget - SyncCent</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F5F0E8; --card: #FFFDF8; --text-main: #2C2416; --text-sub: #7A7067; --border: #E8DFD3; --primary: #2C2416; --r: #D9534F; --g: #5CB85C; --y: #F0AD4E; }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #F0EBE3 0%, #F5F0E8 50%, #EBE5DC 100%);
            pointer-events: none;
            z-index: -1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); }
        .top-bar { background: var(--card); color: var(--text-main); padding: 1rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .top-bar a { color: var(--text-main); text-decoration: none; font-size: 1.25rem; }
        .top-bar h1 { font-size: 1.1rem; font-weight: 600; flex: 1; letter-spacing: -0.025em; }
        .container { max-width: 550px; margin: 0 auto; padding: 1.5rem 1rem; }
        .card { background: var(--card); border-radius: 24px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); }
        .card h2 { font-size: 1.1rem; margin-bottom: 1rem; font-weight: 600; }
        .period { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; }
        .period a { padding: 0.5rem 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; font-size: 0.8125rem; white-space: nowrap; color: var(--text-sub); text-decoration: none; }
        .period a.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        input, select { width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 14px; font-size: 1rem; background: var(--bg); color: var(--text-main); font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 1rem; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .progress { margin: 1.5rem 0; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.875rem; }
        .progress-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
        .progress-fill.safe { background: var(--g); }
        .progress-fill.warn { background: var(--y); }
        .progress-fill.over { background: var(--r); }
        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .summary-item { text-align: center; padding: 1.25rem; background: var(--bg); border-radius: 16px; }
        .summary-item .label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.25rem; }
        .summary-item .value { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
        .remaining { text-align: center; margin-top: 1.5rem; font-size: 1rem; padding: 1.25rem; border-radius: 14px; font-weight: 500; }
        .remaining.positive { background: #DCFCE7; color: #166534; }
        @media (max-width: 480px) { .container { padding: 1rem 0.75rem; } .card { padding: 1.25rem; } }
        * { -webkit-tap-highlight-color: rgba(0,0,0,0); }
</head>
<body>
    <div class="top-bar">
        <a href="{{ request.referrer or '/' }}">←</a>
        <h1>Budget - {{ period_id }}</h1>
    </div>
    <div class="container">
        <div class="period">
            {% for p in periods %}
            <a href="?period={{ p.id }}&type={{ 'group' if is_group else 'personal' }}" class="{{ 'active' if p.id == period_id else '' }}">{{ p.name }}</a>
            {% endfor %}
        </div>

        <div class="card">
            <h2>Set Monthly Budget</h2>
            <form method="POST">
                <div class="form-row">
                    <input type="number" name="amount" placeholder="Budget amount" step="0.01" value="{{ budget.amount if budget else '' }}" required>
                    <button type="submit">Save Budget</button>
                </div>
            </form>
        </div>

        {% if budget %}
        <div class="card">
            <h2>Spending Progress</h2>
            <div class="summary">
                <div class="summary-item">
                    <div class="label">Budget</div>
                    <div class="value">${{ "%.2f"|format(budget.amount) }}</div>
                </div>
                <div class="summary-item">
                    <div class="label">Spent</div>
                    <div class="value">${{ "%.2f"|format(spent) }}</div>
                </div>
            </div>
            
            {% set percentage = (spent / budget.amount * 100)|round|int if budget.amount > 0 else 0 %}
            <div class="progress">
                <div class="progress-label">
                    <span>{{ percentage }}% used</span>
                    <span>${{ "%.2f"|format(budget.amount - spent) }} left</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill {% if percentage < 70 %}safe{% elif percentage < 100 %}warn{% else %}over{% endif %}" style="width: {{ [percentage, 100]|min }}%"></div>
                </div>
            </div>
            
            <div class="remaining {% if spent <= budget.amount %}positive{% else %}negative{% endif %}">
                {% if spent <= budget.amount %}
                    You have ${{ "%.2f"|format(budget.amount - spent) }} remaining this month
                {% else %}
                    You've exceeded your budget by ${{ "%.2f"|format(spent - budget.amount) }}
                {% endif %}
            </div>
        </div>
        {% else %}
        <div class="card" style="text-align:center;color:var(--text-sub)">
            No budget set for this month. Set a budget above to track your spending.
        </div>
        {% endif %}
    </div>
</body>
</html>
