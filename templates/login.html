<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncCent - Login</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        form {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input {
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #ef4444;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        .toggle-text {
            text-align: center;
            font-size: 0.875rem;
        }

        .toggle-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 id="form-title">Login</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form id="auth-form" action="/login" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" id="submit-btn">Login</button>
            </form>
            <div class="toggle-text">
                <span id="toggle-msg">Don't have an account?</span> 
                <a href="#" id="toggle-link" onclick="toggleForm()">Register</a>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        function toggleForm() {
            isLogin = !isLogin;
            const form = document.getElementById('auth-form');
            const title = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const toggleMsg = document.getElementById('toggle-msg');
            const toggleLink = document.getElementById('toggle-link');

            if (isLogin) {
                form.action = '/login';
                title.innerText = 'Login';
                submitBtn.innerText = 'Login';
                toggleMsg.innerText = "Don't have an account?";
                toggleLink.innerText = 'Register';
            } else {
                form.action = '/register';
                title.innerText = 'Register';
                submitBtn.innerText = 'Register';
                toggleMsg.innerText = "Already have an account?";
                toggleLink.innerText = 'Login';
            }
        }
    </script>
</body>
</html>
